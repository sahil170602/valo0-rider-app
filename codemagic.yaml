workflows:
  rider-app-android:
    name: Valo Rider Android APK Build
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      node: latest
      java: 17
      groups:
        - production
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Build Web App
        script: |
          npm run build
      - name: Capacitor Sync
        script: |
          npx cap sync android
      - name: Build Android APK
        script: |
          cd android
          ./gradlew assembleRelease
    artifacts:
      - android/app/build/outputs/apk/release/*.apk
