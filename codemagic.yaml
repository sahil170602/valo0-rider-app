workflows:
  rider-app-android:
    name: Valo Rider Android APK Build
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      node: latest
      java: 21
      android_signing:
        - valo_keystore
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build Web App
        script: npm run build
      - name: Capacitor Sync
        script: npx cap sync android
      - name: Build Android APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
      - name: Sign APK
        script: |
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 -keystore $CM_KEYSTORE_PATH -storepass $CM_KEYSTORE_PASSWORD -keypass $CM_KEY_PASSWORD android/app/build/outputs/apk/release/app-release-unsigned.apk $CM_KEY_ALIAS
          mv android/app/build/outputs/apk/release/app-release-unsigned.apk android/app/build/outputs/apk/release/Valo-Rider-Signed.apk
    artifacts:
      - android/app/build/outputs/apk/release/Valo-Rider-Signed.apk
