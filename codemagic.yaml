      - name: Install dependencies
        script: |
          cd apps/rider-app
          npm install
      - name: Build Web App
        script: |
          cd apps/rider-app
          npm run build
      - name: Capacitor Sync
        script: |
          cd apps/rider-app
          npx cap sync android
      - name: Build Android APK
        script: |
          cd apps/rider-app/android
          ./gradlew assembleRelease
    artifacts:
