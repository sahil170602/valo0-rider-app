workflows:
  rider-app-android:
    name: Valo Rider Android APK Build
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      node: latest
      java: 21
      android_signing:
        - valo_keystore
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build Web App
        script: npm run build
      - name: Capacitor Sync
        script: npx cap sync android
      - name: Build Android APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
      - name: Zipalign and Sign APK (Android 16 Ready)
        script: |
          # 1. Zipalign the APK (Strict requirement for modern Android)
          zipalign -v -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk android/app/build/outputs/apk/release/app-release-aligned.apk
          
          # 2. Sign with Android's official apksigner (Guarantees V2/V3 signatures)
          apksigner sign --ks $CM_KEYSTORE_PATH \
            --ks-pass pass:$CM_KEYSTORE_PASSWORD \
            --key-pass pass:$CM_KEY_PASSWORD \
            --ks-key-alias $CM_KEY_ALIAS \
            android/app/build/outputs/apk/release/app-release-aligned.apk
            
          # 3. Rename for final output
          mv android/app/build/outputs/apk/release/app-release-aligned.apk android/app/build/outputs/apk/release/Valo-Rider-Ready.apk
    artifacts:
      - android/app/build/outputs/apk/release/Valo-Rider-Ready.apk
